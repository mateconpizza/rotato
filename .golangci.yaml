version: "2"
run:
  issues-exit-code: 1
  tests: true
output:
  path-prefix: ""
linters:
  default: all
  disable:
    - copyloopvar
    - cyclop
    - depguard
    - exhaustruct
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gomodguard
    - intrange
    - mnd
    - nlreturn
    - noinlineerr
    - paralleltest
    - revive
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
    gosec:
      excludes:
        - G204
  exclusions:
    rules:
      - path: "term.go"
        linters:
          - lll
      - path: "registry.go"
        linters:
          - lll
      - path: "ansi.go"
        linters:
          - godoclint
      - path: "example/demo.go"
        linters:
          - funlen
      - path: '.*_test\.go'
        linters:
          - goconst
          - funlen
          - cyclop
          - lll
formatters:
  enable:
    - gofumpt
    - goimports
